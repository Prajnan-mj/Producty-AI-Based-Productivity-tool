server {
    listen PORT_PLACEHOLDER;
    root /usr/share/nginx/html;
    index index.html;

    # Google Search Console verification — serve the file directly
    location = /googlefc5ce7187fbefd46.html {
        default_type text/html;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend (same-origin, avoids CORS).
    # API_URL must be set (e.g. https://producty-api-production.up.railway.app)
    # or nginx will fail to start — no host to proxy to.
    location /api/ {
        proxy_pass API_URL_PLACEHOLDER/api/;
        # Railway's edge terminates TLS and routes by SNI + Host. nginx omits
        # SNI on upstream HTTPS by default, so the handshake hangs without
        # this. Host is left at nginx's default ($proxy_host = the backend's
        # own hostname) — overriding it to $host breaks edge routing.
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for /api/ai/chat
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for config.js (runtime-injected)
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
